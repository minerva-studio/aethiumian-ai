site_name: Aethiumian.AI
site_description: "Aethiumian.AI — Behavior-tree AI toolkit for Unity projects"
site_url: https://minerva-studio.github.io/aethiumian-ai/
docs_dir: ../../Documentation~
copyright: 'Aethiumian.AI · <a href="https://github.com/Minerva-Studio/aethiumian-ai">GitHub repository</a><br>Aethiumian.AI is not sponsored by or affiliated with Unity Technologies or its affiliates. Unity is a trademark or registered trademark of Unity Technologies or its affiliates in the U.S. and elsewhere.'

theme:
  name: material
  features:
    - navigation.tabs.sticky
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
  logo: assets/images/ai-docs-favicon.svg
  favicon: assets/images/ai-docs-favicon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - assets/stylesheets/aethiumian-docs.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 简体中文
          build: true
          link: /zh/
          nav_translations:
            Home: 首页
            User Guide: 用户指南
            Node Reference: 节点参考
            Overview: 概览
            Installation: 安装
            Getting Started: 快速上手
            Core Concepts: 核心概念
            AI Editor: AI 编辑器
            Variables: 变量系统
            Runtime Integration: 运行时集成
            Custom Nodes: 自定义节点
            Troubleshooting: 故障排查
            Development Workflow: 开发流程
            Index: 索引页
            Base Types: 基础类型
            Actions: 行动节点
            Arithmetic: 运算节点
            Attributes: 特性
            Calls: 调用节点
            Determines: 判断节点
            Editor: 编辑器节点
            Flow: 流程节点
            Services: 服务节点
            Reference: 节点参考
            Debugging: 故障排查

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed

extra_javascript:
  - assets/javascripts/search-language-filter.js

nav:
  - Home: index.md
  - User Guide:
      - Overview: overview/index.md
      - Installation: installation/index.md
      - Getting Started: getting-started/index.md
      - Core Concepts: concepts/index.md
      - AI Editor: editor/index.md
      - Variables: variables/index.md
      - Runtime Integration: runtime-integration/index.md
      - Custom Nodes: custom-nodes/index.md
      - Troubleshooting: debugging/index.md
      - Development Workflow: development/workflow.md
