name: Unity Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Aethiumian.AI ${{ matrix.unityVersion }} ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unity 6 is the supported line; 2021.3 remains installable but is not tested.
        unityVersion:
          - 6000.3.9f1
        testMode:
          - EditMode
          - PlayMode

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          path: aethiumian-ai

      - name: Add optional test packages to the CI package copy
        run: |
          node -e "const fs = require('node:fs'); const path = 'aethiumian-ai/package.json'; const manifest = JSON.parse(fs.readFileSync(path, 'utf8')); manifest.dependencies ??= {}; Object.assign(manifest.dependencies, { 'com.unity.test-framework.performance': '3.2.1', 'com.unity.nuget.newtonsoft-json': '3.2.2' }); fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\\n');"

      - name: Move package into a subdirectory for package-mode testing
        run: |
          mkdir -p aethiumian-ai/package
          find aethiumian-ai -mindepth 1 -maxdepth 1 ! -name .git ! -name package -exec mv -t aethiumian-ai/package -- {} +

      - name: Run ${{ matrix.testMode }} tests on Unity ${{ matrix.unityVersion }}
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: aethiumian-ai/package
          unityVersion: ${{ matrix.unityVersion }}
          testMode: ${{ matrix.testMode }}
          coverageEnabled: true
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Aethiumian.AI ${{ matrix.unityVersion }} ${{ matrix.testMode }}

      - name: Upload ${{ matrix.unityVersion }} ${{ matrix.testMode }} test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.unityVersion }}-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
